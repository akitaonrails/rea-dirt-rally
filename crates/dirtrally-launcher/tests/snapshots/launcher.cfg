# Settings for DiRTRallyLauncher (DiRT Rally).
# Every key is also a command-line flag: resolution = 1920x1080 is
# --resolution 1920x1080.
# A key left commented out keeps the game's own value.

# The folder with your DiRT Rally for Linux (it holds bin/DirtRally). It is
# only read, never changed.
# Values: a folder or file.
#game =

# Original opens the game's own pre-game window first, as it shipped.
# Recommended starts the race game straight away at your screen's size.
# Steam Deck does the same at 1280x800.
# Values: original, recommended or steam_deck.
#look =

# The size the game opens at: fullscreen for your screen's size, a size such
# as 2560x1440, or original to choose it in the game's own pre-game window.
# Values: WIDTHxHEIGHT, original, off, fullscreen, full or desktop.
#resolution = fullscreen

# Where the launcher keeps its private copy of the game. Default:
# ~/.local/share/dirtrally-launcher/runtime.
# Values: a folder or file.
#runtime =
