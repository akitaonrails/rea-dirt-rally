[package]
name = "dirtrally-launcher"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs the player's own copy of DiRT Rally on modern Windows and Linux"
publish = false

[[bin]]
name = "DiRTRallyLauncher"
path = "src/main.rs"

[dependencies]
rea-launcher.workspace = true
# Its Windows parts are cfg(windows); the console decision is portable.
rea-launcher-win32.workspace = true
quick-xml = "0.41"
serde_json = "1"

# The settings window, on Linux (the supported edition) and Windows.
rea-launcher-ui.workspace = true

# The settings window also builds on the host for its tests: the palette's
# contrast test and the headless window tests (egui_kittest) run with
# `cargo test` and under `sdk/scripts/wine-test`.
[dev-dependencies]
rea-launcher-ui = { workspace = true, features = ["testing"] }
