[workspace]
members = ["crates/dirtrally-launcher", "crates/dirtrally-exec-read"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/akitaonrails/rea-dirt-rally"

[workspace.dependencies]
# The shared launcher SDK, pinned to a release tag. To move to a new release,
# change the tag on all three lines, re-run `scripts/sdk-sync` from that SDK
# checkout and move the `@vX.Y.Z` of the workflows in .github/workflows/build.yml
# (rea-launcher-sdk docs/playbooks/sdk-change.md).
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.4.1" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.4.1" }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.4.1" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
