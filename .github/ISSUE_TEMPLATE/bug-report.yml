name: Bug report
description: "DiRTRallyLauncher does not run DiRT Rally as it should."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never attach DirtRally, libraries, saves, media or any other
        game files. Remove usernames and personal paths from settings and logs.
  - type: dropdown
    id: system
    attributes:
      label: Where did you play?
      options:
        - Linux with the AppImage
        - Linux with the zip (dirtrally-play)
        - Linux, gamescope in a container (DIRTRALLY_RUN)
        - Steam Deck (Desktop Mode)
        - Steam Deck (Game Mode)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, e.g. "DiRTRallyLauncher 0.1.0".
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: Edition or SHA-256
      description: |
        launcher.log names the game's edition (the "game:" line), or the SHA-256 of a build it
        does not know. By hand: `sha256sum bin/DirtRally` in the game folder.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, graphics card, controller and screen
      description: e.g. "Ryzen 7 7800X3D, RTX 3060, Xbox-style pad, 2560x1440 at 144 Hz".
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings used
      description: The look and anything you changed, or launcher.cfg without personal paths.
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: |
        ~/.config/dirtrally-launcher/launcher.log (and play.log beside it).
        Remove personal paths before posting.
      render: text
    validations:
      required: true
